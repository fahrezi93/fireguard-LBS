name: Deploy to aaPanel VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /www/wwwroot/fireguard-LBS
            
            # Izinkan Git berjalan
            git config --global --add safe.directory /www/wwwroot/fireguard-LBS
            
            # Tarik update terbaru
            git pull origin main
            
            # Install package baru & build
            npm install
            npm run build
            
            # (Perlu direstart manual via aaPanel GUI setelah proses ini selesai)
